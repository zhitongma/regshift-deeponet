# ==============================================================================
# E5 外部真实降雨测试集 — 评估配置 (RegShift = Shift-DeepONet + 有界仿射变换)
# 基版: configs/qtop_func/boost_A4_shift.yaml + RegShift 界限参数
# 用途: 06_evaluate.py 在 e5_realrain_eval_regshift_* run 上以 m1 视角评估
#       「训练前向确为有界」的 RegShift m1_best.pt。
# ⚠️ E0 门槛 (config-checkpoint 训练时前向一致性问题, 两个 preflight 都拦不住):
#    - 仅当 E0 定性为 H2 时才可用本配置评估历史 g4_regshift_iid_s* checkpoint
#      (E5_REGSHIFT_MODE=h2_bounded);
#    - 若 E0 定性为 H1 (当前初步判定, 置信度高: 历史 checkpoint 实按无界前向训练,
#      末层 bias≈[0.98,0.99,0.05,0.05]), 历史 checkpoint 改用
#      e5_eval_regshift_hist_unbounded.yaml 评估 (E5_REGSHIFT_MODE=h1_hist_unbounded);
#      本配置只用于评估用修复代码重跑的真有界 RegShift run
#      (E5_REGSHIFT_MODE=h1_retrained, run 位于 runs_revision 下)。
# ⚠️ 界限参数必须写在 model.shift_deeponet.transform_bound_* 之下
#    (build_shift_deeponet 只读该层级, src/models/shift_deeponet.py:155-172;
#     历史 bug 是写在顶层 shift_deeponet: 块 —— 见 REPO_FACTS.md §1 与 E0)。
#    跑前必须过 E0 preflight (--expect-scale 0.3 --expect-shift 0.2)。
# ==============================================================================

physics:
  domain_length: 100.0
  simulation_time: 48.0
  n_spatial_nodes: 101
  n_time_steps: 49
  initial_head: -100.0
  initial_conc: 0.0

parameters:
  theta_r: {min: 0.034, max: 0.098, distribution: uniform}
  theta_s: {min: 0.36, max: 0.51, distribution: uniform}
  alpha: {min: 0.005, max: 0.145, distribution: log_uniform}
  n_vg: {min: 1.09, max: 2.68, distribution: uniform}
  K_s: {min: 0.25, max: 29.7, distribution: log_uniform}
  D_L: {min: 1.0, max: 20.0, distribution: uniform}
  q_top: {min: 0.1, max: 5.0, distribution: uniform}
  c_top: {min: 0.1, max: 1.0, distribution: uniform}

q_top_function:
  enabled: true
  n_steps: 48
  n_control_points: 6
  min_flux: 0.1
  max_flux: 5.0

data:
  n_total: 1024
  n_train: 768
  n_val: 128
  n_test: 128
  seed: 42
  split_mode: iid
  ood_parameter: q_top_peak
  ood_quantile: 0.9
  ood_tail: high
  qc_mass_balance_threshold: 0.01

model:
  arch: shift_deeponet
  branch_input_dim: 57
  branch_hidden: [512, 512, 512, 512]
  trunk_input_dim: 2
  trunk_hidden: [256, 256, 256, 256]
  trunk_output_dim: 256
  num_outputs: 2
  activation: gelu
  trunk_encoding: fourier
  fourier_features: 32
  fourier_scale: 4.0
  use_output_heads: true
  output_head_hidden: [256]
  shift_deeponet:
    transform_hidden: [64, 64]
    transform_bound_scale: 0.3
    transform_bound_shift: 0.2

fnn:
  hidden_dims: [512, 512, 512, 512]

grid_fnn:
  hidden_dims: [1024, 1024, 1024]
  use_layer_norm: true

training:
  epochs: 2000
  learning_rate: 1.0e-3
  m2_learning_rate: 1.0e-4
  lr_min: 1.0e-6
  lr_scheduler: reduce_on_plateau
  val_interval: 100
  lr_patience: 400
  lr_factor: 0.5
  batch_size: 32
  early_stopping_patience: 800
  optimizer: adam
  seed: 42
  n_coords_train: 1024
  m2_warm_start: true
  m2_warm_start_checkpoint: m1_best.pt
  m2_scheduler_metric: loss
  m2_early_stopping_metric: loss
  m2_best_alias_metric: score
  m2_phase2_selection_only: false
  m2_phase2_reset_scheduler: false
  m2_phase2_reset_early_stopping: false
  m2_phase2_require_entry_before_early_stop: false

data_loss:
  w_h: 1.0
  w_c: 1.0

mass_loss:
  target_mode: true_flux
  objective_mode: relative_mse
  selection_mass_metric: objective
  w_mass_phase1: 0.00
  w_mass_phase2: 0.05
  switch_epoch_fraction: 0.40
  w_mass_water: 1.0
  w_mass_solute: 0.2
  w_mass_water_phase1: 1.0
  w_mass_water_phase2: 1.0
  w_mass_solute_phase1: 0.2
  w_mass_solute_phase2: 0.2
  selection_data_weight: 1.0
  selection_mass_water_weight: 0.02
  selection_mass_solute_weight: 0.005

paths:
  raw_data: data/raw
  processed_data: data/processed
  parameters: data/parameters
  checkpoints: results/checkpoints
  logs: results/logs
  experiments: results/experiments
  figures: figures
