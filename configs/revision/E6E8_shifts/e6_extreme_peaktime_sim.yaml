# ==============================================================================
# E6-B(2) 越界峰时仿真配置（基版: configs/qtop_func/qtop_func_ood_peak_time_medium.yaml）
# 用途: 02_run_hydrus / process_extreme（本包）读取 physics 与 qc 阈值。
# 注意: 参数表由本包 make_extreme_params.py 直接构造 32 个样本，
#       峰值时刻 q_top_peak_time 压在最后 4 小时（44/45/46/47 h 各 8 个），
#       峰值幅值保持在训练幅值范围内（<= 5.0 cm/h），用于隔离"峰时"这一轴。
# ==============================================================================

physics:
  domain_length: 100.0
  simulation_time: 48.0
  n_spatial_nodes: 101
  n_time_steps: 49
  initial_head: -100.0
  initial_conc: 0.0

parameters:
  theta_r:
    min: 0.034
    max: 0.098
    distribution: uniform
  theta_s:
    min: 0.36
    max: 0.51
    distribution: uniform
  alpha:
    min: 0.005
    max: 0.145
    distribution: log_uniform
  n_vg:
    min: 1.09
    max: 2.68
    distribution: uniform
  K_s:
    min: 0.25
    max: 29.7
    distribution: log_uniform
  D_L:
    min: 1.0
    max: 20.0
    distribution: uniform
  q_top:
    min: 0.1
    max: 5.0
    distribution: uniform
  c_top:
    min: 0.1
    max: 1.0
    distribution: uniform

q_top_function:
  enabled: true
  n_steps: 48
  n_control_points: 6
  min_flux: 0.1
  max_flux: 5.0

data:
  # n_* 为本集实际规模（32）；01 不会被调用，仅供记录。
  # split_mode / ood_parameter / ood_quantile / ood_tail / qc 阈值与 ood_peak_time 基版一致。
  n_total: 32
  n_train: 0
  n_val: 0
  n_test: 32
  seed: 42
  split_mode: ood
  ood_parameter: q_top_peak_time
  ood_quantile: 0.9
  ood_tail: high
  qc_mass_balance_threshold: 0.01

model:
  branch_input_dim: 57
  branch_hidden: [512, 512, 512, 512]
  trunk_input_dim: 2
  trunk_hidden: [256, 256, 256, 256]
  trunk_output_dim: 256
  num_outputs: 2
  activation: gelu
  multi_output_strategy: split_branch
  use_residual: true
  use_layer_norm: true
  trunk_encoding: fourier
  fourier_features: 32
  fourier_scale: 4.0
  use_output_heads: true
  output_head_hidden: [256]

fnn:
  hidden_dims: [512, 512, 512, 512]

fno:
  width: 32
  modes_z: 16
  modes_t: 10
  n_layers: 4

grid_fnn:
  hidden_dims: [1024, 1024, 1024]
  use_layer_norm: true

training:
  epochs: 2000
  learning_rate: 1.0e-3
  m2_learning_rate: 1.0e-4
  lr_min: 1.0e-6
  lr_scheduler: reduce_on_plateau
  val_interval: 100
  lr_patience: 400
  lr_factor: 0.5
  batch_size: 32
  early_stopping_patience: 800
  optimizer: adam
  seed: 42
  m2_warm_start: true
  m2_warm_start_checkpoint: m1_best.pt
  m2_scheduler_metric: loss
  m2_early_stopping_metric: loss
  m2_best_alias_metric: score
  m2_phase2_selection_only: false
  m2_phase2_reset_scheduler: false
  m2_phase2_reset_early_stopping: false
  m2_phase2_require_entry_before_early_stop: false

data_loss:
  w_h: 1.0
  w_c: 1.0

mass_loss:
  target_mode: true_flux
  objective_mode: relative_mse
  selection_mass_metric: objective
  w_mass_phase1: 0.00
  w_mass_phase2: 0.05
  switch_epoch_fraction: 0.40
  w_mass_water: 1.0
  w_mass_solute: 0.2
  w_mass_water_phase1: 1.0
  w_mass_water_phase2: 1.0
  w_mass_solute_phase1: 0.2
  w_mass_solute_phase2: 0.2
  selection_data_weight: 1.0
  selection_mass_water_weight: 0.02
  selection_mass_solute_weight: 0.005

paths:
  raw_data: data/raw
  processed_data: data/processed
  parameters: data/parameters
  checkpoints: results/checkpoints
  logs: results/logs
  experiments: results/experiments
  figures: figures
