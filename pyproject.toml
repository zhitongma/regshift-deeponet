[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrol-regshift-deeponet"
version = "0.1.0"
description = "Bounded-coordinate DeepONet benchmark for unsaturated flow and solute transport"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/plotting.txt"]}

[project.optional-dependencies]
training = ["torch==2.3.0"]
hydrus = ["torch==2.3.0", "phydrus"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
